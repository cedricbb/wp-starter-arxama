services:
  nginx:
    container_name: wp-nginx-${PROJECT_NAME}
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_DOMAIN}`)"
      - "traefik.http.routers.${PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}.tls=true"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=80"
    networks:
      - backend

  php:
    container_name: wp-php-${PROJECT_NAME}
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    networks:
      - backend

  # Redis est déjà présent dans la stack globale (stack-dev), mais si chaque projet a besoin de son propre cache isolé,
  # on peut garder un redis par projet. Sinon, on peut utiliser le redis global.
  # Pour l'instant, on garde un redis par projet pour éviter les conflits de clés si le préfixe n'est pas géré.
  redis:
    container_name: wp-redis-${PROJECT_NAME}
    image: redis:5-alpine
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    networks:
      - backend

networks:
  backend:
    external: true
    name: backend
