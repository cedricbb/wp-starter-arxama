services:
  nginx:
    container_name: wp-nginx-${PROJECT_NAME}
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
      mariadb:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_DOMAIN}`)"
      - "traefik.http.routers.${PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}.tls=true"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=80"
    networks:
      - backend

  php:
    container_name: wp-php-${PROJECT_NAME}
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend

  mariadb:
    container_name: wp-db-${PROJECT_NAME}
    image: mariadb:10.11.9-ubi
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    labels:
      - "traefik.enable=false"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: wp-redis-${PROJECT_NAME}
    image: redis:5-alpine
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    networks:
      - backend

networks:
  backend:
    external: true

volumes:
  db_data:
